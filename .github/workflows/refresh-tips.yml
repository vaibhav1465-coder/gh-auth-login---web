name: Refresh MCX Tips

on:
  schedule:
    # 09:15 IST = 03:45 UTC (morning, market open)
    - cron: '45 3 * * *'
    # 19:00 IST = 13:30 UTC (evening, NY session prep)
    - cron: '30 13 * * *'
  workflow_dispatch:  # allow manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch live prices and build data file
        run: |
          set -e
          NOW_UTC=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          NOW_IST=$(TZ='Asia/Kolkata' date +"%d %b %Y · %H:%M IST")
          IST_HOUR=$(TZ='Asia/Kolkata' date +%H)
          if [ "$IST_HOUR" -lt 12 ]; then
            SESSION="morning"
            HEADLINE="Morning open prep — overnight COMEX action"
          else
            SESSION="evening"
            HEADLINE="NY-session prep — US data window opening"
          fi

          USDINR=$(curl -fsS "https://open.er-api.com/v6/latest/USD" 2>/dev/null | python3 -c "import sys,json; print(json.load(sys.stdin)['rates']['INR'])" 2>/dev/null || echo "83.50")
          GOLD_SPOT=$(curl -fsS "https://api.gold-api.com/price/XAU" 2>/dev/null | python3 -c "import sys,json; print(json.load(sys.stdin).get('price',0))" 2>/dev/null || echo "4800")
          SILVER_SPOT=$(curl -fsS "https://api.gold-api.com/price/XAG" 2>/dev/null | python3 -c "import sys,json; print(json.load(sys.stdin).get('price',0))" 2>/dev/null || echo "79")

          GOLD_MCX=$(python3 -c "print(round(${GOLD_SPOT} * ${USDINR} / 31.1035 * 10 * 1.03))")
          SILVER_MCX=$(python3 -c "print(round(${SILVER_SPOT} * ${USDINR} / 31.1035 * 1000 * 1.03))")
          RATIO=$(python3 -c "print(round((${GOLD_MCX}/10) / (${SILVER_MCX}/1000), 2))")

          mkdir -p data
          cat > data/latest.json <<EOF
          {
            "updatedAt": "${NOW_UTC}",
            "updatedAtIst": "${NOW_IST}",
            "session": "${SESSION}",
            "headline": "${HEADLINE}",
            "goldMiniMcx": ${GOLD_MCX},
            "silverMicMcx": ${SILVER_MCX},
            "goldSpotUsd": ${GOLD_SPOT},
            "silverSpotUsd": ${SILVER_SPOT},
            "usdInr": ${USDINR},
            "ratio": ${RATIO}
          }
          EOF

          echo "Generated data/latest.json:"
          cat data/latest.json

      - name: Commit data update
        run: |
          git config user.name "MCX Refresh Bot"
          git config user.email "bot@mcx-refresh.local"
          if [ -n "$(git status --porcelain)" ]; then
            git add data/latest.json
            git commit -m "Refresh MCX tips · $(TZ='Asia/Kolkata' date +'%d %b %Y · %H:%M IST')"
            git push
          else
            echo "No data changes — skipping commit"
          fi

      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: bb23027e-a4b3-4f8f-8dbf-8f176d5183e7
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "::warning::NETLIFY_AUTH_TOKEN secret not set — skipping deploy. Add it under Settings > Secrets > Actions."
            exit 0
          fi
          npm install -g netlify-cli@latest --silent
          netlify deploy --prod --dir=. --site=$NETLIFY_SITE_ID --auth=$NETLIFY_AUTH_TOKEN
